version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - copyloopvar
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - unconvert
    - unparam
    - unused
  settings:
    staticcheck:
      checks:
        - "all"
        - "-QF1004"
        - "-QF1008"
        - "-ST1000"
        - "-ST1001"
        - "-ST1003"
  exclusions:
    # Exclusion presets (none = don't exclude defaults)
    presets: []
    # Path-based exclusions
    rules:
      - path: "api/"
        linters:
          - lll
      - path: "internal/"
        linters:
          - dupl
          - lll
      - path: "test/"
        linters:
          - lll
          - revive
          - staticcheck
      # Exclude kubebuilder annotations from comment-spacings rule
      - source: "^//\\+kubebuilder:"
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
